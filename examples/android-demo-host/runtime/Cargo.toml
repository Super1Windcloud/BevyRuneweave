[package]
name = "bevy-runeweave-android-host"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "bevy_runeweave_android_host"
crate-type = ["cdylib"]

[workspace]

[features]
default = []
documentation = ["bevy-runeweave/documentation"]
dynamic_components = ["bevy-runeweave/dynamic_components"]
script_systems = ["bevy-runeweave/script_systems"]
full_scripting = ["documentation", "dynamic_components", "script_systems"]

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["android-native-activity"] }
bevy-runeweave = { path = "../../..", default-features = false, features = ["unified"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
