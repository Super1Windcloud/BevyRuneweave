[package]
name = "bevy-runeweave-desktop-demo-host"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[workspace]

[[bin]]
name = "bevy-runeweave-demo"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
flate2 = "1"
libloading = "0.9.0"
lzma-rust2 = { version = "0.18.1", default-features = false, features = ["std", "xz"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust = { version = "0.6.1", default-features = false, features = ["bzip2", "zstd"] }
tar = { version = "0.4.46", default-features = false }
tempfile = "3"
zip = { version = "8.6.0", default-features = false, features = ["bzip2", "deflate-flate2", "lzma", "xz", "zstd"] }
zstd = { version = "0.13.3", default-features = false }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
unrar = "0.5.8"

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[dev-dependencies]
lzma-rust2 = { version = "0.18.1", default-features = false, features = ["encoder", "std", "xz"] }
