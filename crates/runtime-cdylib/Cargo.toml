[package]
name = "bevy-runeweave-runtime-cdylib"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "bevy_runeweave"
crate-type = ["cdylib"]

[features]
default = ["unified"]
unified = ["bevy-runeweave/unified"]
js = ["bevy-runeweave/js"]
typescript = ["bevy-runeweave/typescript"]
lua = ["bevy-runeweave/lua"]

[dependencies]
bevy-runeweave = { path = "../..", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["android-native-activity"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
