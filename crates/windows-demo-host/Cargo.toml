[package]
name = "bevy-runeweave-windows-demo-host"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "bevy-runeweave-demo"
path = "src/main.rs"

[dependencies]
compress-tools = "0.15"
libloading = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"

[lints]
workspace = true
