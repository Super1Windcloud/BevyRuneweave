[package]
name = "bevy-script-runtime"
version = "0.1.0"
edition = "2024"
autobins = false

[workspace]
members = [
    "projects/js",
    "projects/lua",
    "projects/luau",
    "projects/ts",
]
exclude = ["bevy_mod_scripting"]
resolver = "2"

[lib]
name = "bevy_script_runtime"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["js"]
js = ["bevy_mod_scripting/quickjs"]
typescript = ["bevy_mod_scripting/typescript"]
lua = ["bevy_mod_scripting/lua55"]
luau = ["bevy_mod_scripting/luau"]

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["2d", "file_watcher"] }
bevy_mod_scripting = { path = "bevy_mod_scripting", default-features = false }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
strip = "symbols"
